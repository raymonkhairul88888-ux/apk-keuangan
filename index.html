<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Keuangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library Chart.js untuk Grafik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { 
      background-color: #e2e8f0; 
      color: #0f172a; 
      font-family: system-ui, -apple-system, sans-serif; 
    }
    .app-card { 
      background-color: #0d4b56; 
      color: #ffffff; 
    }
    .btn-primary { 
      background-color: #0d4b56; 
      color: #ffffff; 
    }
    .btn-primary:hover { 
      background-color: #093740; 
    }
    .input-custom { 
      background-color: #ffffff; 
      border: 1px solid #cbd5e1; 
      color: #1e293b; 
    }
    .input-custom:focus { 
      outline: none; 
      border-color: #0d4b56; 
    }
    .tab-active { 
      border-bottom: 2px solid #0d4b56; 
      color: #0d4b56; 
      font-weight: 700; 
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4">

  <!-- Container Bingkai HP (Mockup Screen) -->
  <div class="w-full max-w-[360px] bg-white rounded-[32px] shadow-2xl overflow-hidden p-4 space-y-4 border border-slate-200 min-h-[620px] flex flex-col justify-between">
    
    <!-- Kontainer Wajib untuk React di CodeSandbox -->
    <div id="root"></div>

    <!-- ==================== TAMPILAN 1: DASHBOARD UTAMA ==================== -->
    <div id="tampilanUtama" class="space-y-4 flex-1">
      
      <!-- Card Tombol Menuju Tampilan 2 (Input Transaksi) -->
      <div class="app-card p-5 rounded-[24px] shadow-md space-y-2 relative cursor-pointer hover:opacity-95 transition" onclick="bukaHalaman('tampilanForm')">
        <div class="flex justify-between items-center text-[10px] font-bold tracking-widest uppercase opacity-80">
          <span>CATATAN ASISTEN</span>
        </div>
        
        <div class="flex justify-between items-center pt-1">
          <p class="text-xs font-extrabold uppercase tracking-wider opacity-90">PEMBUKUAN KEUANGAN &rsaquo;</p>
          <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-bold">+ TAMBAH</span>
        </div>
      </div>

      <!-- GRAFIK KEUANGAN (Pengganti Tombol Tambah Transaksi) -->
      <div class="bg-slate-50 p-4 rounded-[24px] border border-slate-100 shadow-sm space-y-2">
        <div class="flex justify-between items-center">
          <h3 class="text-[11px] font-extrabold text-slate-700 tracking-wider uppercase">GRAFIK KEUANGAN</h3>
          <span id="labelTotalTransaksi" class="text-[10px] font-bold text-slate-400">0 Transaksi</span>
        </div>
        
        <div class="relative flex items-center justify-center h-44 w-full pt-1">
          <canvas id="grafikKeuangan"></canvas>
        </div>
      </div>

      <hr class="border-slate-100 my-1" />

      <!-- Filter Tab & List Transaksi -->
      <div class="space-y-2 px-1">
        <div class="flex space-x-5 text-xs border-b border-slate-100 pb-2">
          <button onclick="setFilter('SEMUA')" id="tab-SEMUA" class="tab-active pb-1 text-[11px]">SEMUA</button>
          <button onclick="setFilter('Keluar')" id="tab-Keluar" class="text-slate-400 font-semibold pb-1 text-[11px]">KELUAR</button>
          <button onclick="setFilter('Masuk')" id="tab-Masuk" class="text-slate-400 font-semibold pb-1 text-[11px]">MASUK</button>
        </div>

        <!-- Riwayat Transaksi List -->
        <ul id="daftarTransaksi" class="space-y-2 text-xs max-h-[180px] overflow-y-auto pr-1">
          <li class="py-4 text-center text-slate-400 text-xs">Belum ada transaksi.</li>
        </ul>
      </div>

    </div>

    <!-- ==================== TAMPILAN 2: FORM INPUT TRANSAKSI & DETAIL SALDO ==================== -->
    <div id="tampilanForm" class="space-y-4 flex-1 hidden">
      
      <!-- Header Halaman Form -->
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <button onclick="bukaHalaman('tampilanUtama')" class="text-slate-600 font-bold text-xs flex items-center gap-1 hover:text-slate-900">
          &larr; Kembali
        </button>
        <span class="text-xs font-extrabold text-slate-800 uppercase tracking-wider">Input Transaksi</span>
        <div class="w-8"></div>
      </div>

      <!-- Card Ringkasan Nominal Pembukuan -->
      <div class="app-card p-5 rounded-[24px] shadow-md space-y-2 relative">
        <div class="flex justify-between items-center text-[10px] font-bold tracking-widest uppercase opacity-80">
          <span>CATATAN ASISTEN</span>
        </div>
        
        <div>
          <p class="text-[10px] font-bold uppercase tracking-wider opacity-70">NOMINAL PEMBUKUAN</p>
          <h2 id="saldoTotal" class="text-2xl font-extrabold tracking-tight pt-1">Rp 0</h2>
        </div>
      </div>

      <!-- Form Input Data -->
      <div class="space-y-3 pt-1">
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Jenis Transaksi</label>
          <select id="jenis" class="input-custom w-full p-2.5 rounded-xl text-xs font-semibold">
            <option value="Masuk">Uang Masuk (+)</option>
            <option value="Keluar">Uang Keluar (-)</option>
          </select>
        </div>

        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Jumlah Nominal</label>
          <input type="number" id="nominal" placeholder="Jumlah (Rp)" class="input-custom w-full p-2.5 rounded-xl text-xs font-medium" />
        </div>

        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Keterangan Transaksi</label>
          <input type="text" id="keterangan" placeholder="Keterangan (misal: Gaji)" class="input-custom w-full p-2.5 rounded-xl text-xs font-medium" />
        </div>

        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Kategori</label>
          <select id="kategori" class="input-custom w-full p-2.5 rounded-xl text-xs font-semibold">
            <option value="GAJI">Gaji</option>
            <option value="BELANJA">Belanja</option>
            <option value="RESTORAN">Restoran</option>
            <option value="TRANSPORT">Transport</option>
          </select>
        </div>

        <div class="pt-2">
          <button onclick="tambahTransaksi()" class="btn-primary w-full p-3 rounded-xl text-xs font-bold transition shadow-sm">
            Simpan Transaksi
          </button>
        </div>
      </div>

    </div>

  </div>

  <!-- Script Logika Aplikasi & Grafik -->
  <script>
    // Data bawaan awal sesuai gambar permintaan
    const dataAwal = [
      { keterangan: 'GAJI', nominal: 89000000, jenis: 'Masuk', kategori: 'GAJI', tanggal: '8 SEP' },
      { keterangan: 'UANG SEKOLAH', nominal: 15200000, jenis: 'Masuk', kategori: 'GAJI', tanggal: '8 SEP' },
      { keterangan: 'JAJAN', nominal: 56225145, jenis: 'Keluar', kategori: 'GAJI', tanggal: '8 SEP' },
      { keterangan: 'JAJAN', nominal: 13000000, jenis: 'Keluar', kategori: 'GAJI', tanggal: '8 SEP' },
      { keterangan: 'GAJI', nominal: 22000000, jenis: 'Masuk', kategori: 'GAJI', tanggal: '8 SEP' }
    ];

    let dataTransaksi = JSON.parse(localStorage.getItem('keuangan_db'));
    if (!dataTransaksi || dataTransaksi.length === 0) {
      dataTransaksi = dataAwal;
    }

    let filterAktif = 'SEMUA';
    let chartInstance = null;

    function formatRupiah(angka) {
      const isMinus = angka < 0;
      const absoluteVal = Math.abs(angka);
      const formatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(absoluteVal);
      return isMinus ? '-' + formatted : formatted;
    }

    function bukaHalaman(halamanId) {
      document.getElementById('tampilanUtama').classList.add('hidden');
      document.getElementById('tampilanForm').classList.add('hidden');
      document.getElementById(halamanId).classList.remove('hidden');
    }

    function setFilter(filter) {
      filterAktif = filter;
      ['SEMUA', 'Keluar', 'Masuk'].forEach(tab => {
        const el = document.getElementById('tab-' + tab);
        if (tab === filter) {
          el.className = 'tab-active pb-1 text-[11px]';
        } else {
          el.className = 'text-slate-400 font-semibold pb-1 text-[11px]';
        }
      });
      updateUI();
    }

    function renderGrafik() {
      const ctx = document.getElementById('grafikKeuangan').getContext('2d');
      
      let masuk = 0;
      let keluar = 0;

      dataTransaksi.forEach(item => {
        if (item.jenis === 'Masuk') masuk += item.nominal;
        if (item.jenis === 'Keluar') keluar += item.nominal;
      });

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Pemasukan', 'Pengeluaran'],
          datasets: [{
            data: [masuk || 1, keluar || 0],
            backgroundColor: ['#2da2b5', '#0d4b56'],
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                boxWidth: 10,
                font: { size: 10, weight: 'bold' }
              }
            }
          },
          cutout: '65%'
        }
      });

      document.getElementById('labelTotalTransaksi').innerText = dataTransaksi.length + ' Transaksi';
    }

    function updateUI() {
      const daftar = document.getElementById('daftarTransaksi');
      daftar.innerHTML = '';

      let masuk = 0;
      let keluar = 0;

      dataTransaksi.forEach(item => {
        if (item.jenis === 'Masuk') masuk += item.nominal;
        if (item.jenis === 'Keluar') keluar += item.nominal;
      });

      document.getElementById('saldoTotal').innerText = formatRupiah(masuk - keluar);

      const dataFiltered = dataTransaksi.filter(item => {
        if (filterAktif === 'SEMUA') return true;
        return item.jenis === filterAktif;
      });

      if (dataFiltered.length === 0) {
        daftar.innerHTML = '<li class="py-4 text-center text-slate-400 text-xs">Belum ada transaksi.</li>';
      } else {
        dataFiltered.forEach((item, index) => {
          const li = document.createElement('li');
          li.className = 'flex justify-between items-center py-1 border-b border-dashed border-slate-100 last:border-none';
          
          const isKeluar = item.jenis === 'Keluar';
          const tAnda = isKeluar ? '- ' : '+ ';
          const warnaTeks = isKeluar ? 'text-rose-500' : 'text-emerald-600';

          li.innerHTML = `
            <div>
              <p class="font-extrabold text-slate-800 uppercase text-[11px] leading-tight">${item.keterangan}</p>
              <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">${item.kategori || 'GAJI'} &bull; ${item.tanggal}</p>
            </div>
            <div class="text-right">
              <p class="font-extrabold ${warnaTeks} text-[11px]">
                ${tAnda}${formatRupiah(item.nominal)}
              </p>
              <button onclick="hapusSatu(${index})" class="text-[8px] text-slate-300 hover:text-rose-500">Hapus</button>
            </div>
          `;
          daftar.appendChild(li);
        });
      }

      localStorage.setItem('keuangan_db', JSON.stringify(dataTransaksi));
      renderGrafik();
    }

    function tambahTransaksi() {
      const ket = document.getElementById('keterangan').value.trim();
      const nom = Number(document.getElementById('nominal').value);
      const jns = document.getElementById('jenis').value;
      const kat = document.getElementById('kategori').value;

      if (!ket || !nom || nom <= 0) {
        alert('Mohon isi keterangan dan nominal dengan benar!');
        return;
      }

      const tgl = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }).toUpperCase();
      dataTransaksi.unshift({ keterangan: ket.toUpperCase(), nominal: nom, jenis: jns, kategori: kat, tanggal: tgl });

      document.getElementById('keterangan').value = '';
      document.getElementById('nominal').value = '';
      
      updateUI();
      bukaHalaman('tampilanUtama');
    }

    function hapusSatu(index) {
      dataTransaksi.splice(index, 1);
      updateUI();
    }

    updateUI();
  </script>
</body>
</html>
