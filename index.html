<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Keuangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; }
    .input-field { background-color: #0f172a; border: 1px solid #334155; color: #fff; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto space-y-4">

  <!-- Kontainer Wajib untuk React di CodeSandbox -->
  <div id="root"></div>

  <!-- Header & Saldo -->
  <div class="card p-5 rounded-2xl shadow-lg space-y-2">
    <h1 class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Total Saldo Saat Ini</h1>
    <h2 id="saldoTotal" class="text-3xl font-extrabold text-indigo-400">Rp 0</h2>
    
    <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-700/50">
      <div>
        <p class="text-[10px] text-slate-400">Pemasukan</p>
        <p id="totalMasuk" class="text-sm font-bold text-emerald-400">Rp 0</p>
      </div>
      <div>
        <p class="text-[10px] text-slate-400">Pengeluaran</p>
        <p id="totalKeluar" class="text-sm font-bold text-rose-400">Rp 0</p>
      </div>
    </div>
  </div>

  <!-- Form Input Transaksi -->
  <div class="card p-5 rounded-2xl shadow-lg space-y-3">
    <h3 class="text-sm font-bold text-slate-200">Tambah Transaksi Baru</h3>
    
    <div class="space-y-2">
      <input type="text" id="keterangan" placeholder="Keterangan (misal: Beli Kopi)" class="input-field w-full p-2.5 rounded-xl text-xs outline-none focus:border-indigo-500" />
      <input type="number" id="nominal" placeholder="Nominal (misal: 25000)" class="input-field w-full p-2.5 rounded-xl text-xs outline-none focus:border-indigo-500" />
      
      <div class="grid grid-cols-2 gap-2">
        <select id="jenis" class="input-field p-2.5 rounded-xl text-xs outline-none">
          <option value="Masuk">Pemasukan (+)</option>
          <option value="Keluar">Pengeluaran (-)</option>
        </select>
        <button onclick="tambahTransaksi()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-2.5 rounded-xl text-xs transition">
          Simpan
        </button>
      </div>
    </div>
  </div>

  <!-- Riwayat Transaksi -->
  <div class="card p-5 rounded-2xl shadow-lg space-y-3">
    <div class="flex justify-between items-center">
      <h3 class="text-sm font-bold text-slate-200">Riwayat Transaksi</h3>
      <button onclick="resetData()" class="text-[10px] text-rose-400 hover:underline">Reset Data</button>
    </div>
    <ul id="daftarTransaksi" class="divide-y divide-slate-800 text-xs">
      <li class="py-3 text-center text-slate-500">Belum ada transaksi.</li>
    </ul>
  </div>

  <!-- Script Logika Aplikasi -->
  <script>
    let dataTransaksi = JSON.parse(localStorage.getItem('keuangan_db')) || [];

    function formatRupiah(angka) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
    }

    function updateUI() {
      const daftar = document.getElementById('daftarTransaksi');
      daftar.innerHTML = '';

      let masuk = 0;
      let keluar = 0;

      if (dataTransaksi.length === 0) {
        daftar.innerHTML = '<li class="py-3 text-center text-slate-500">Belum ada transaksi.</li>';
      } else {
        dataTransaksi.forEach((item, index) => {
          if (item.jenis === 'Masuk') masuk += item.nominal;
          if (item.jenis === 'Keluar') keluar += item.nominal;

          const li = document.createElement('li');
          li.className = 'py-2.5 flex justify-between items-center';
          li.innerHTML = `
            <div>
              <p class="font-medium text-slate-200">${item.keterangan}</p>
              <p class="text-[10px] text-slate-500">${item.tanggal}</p>
            </div>
            <div class="text-right">
              <p class="font-bold ${item.jenis === 'Masuk' ? 'text-emerald-400' : 'text-rose-400'}">
                ${item.jenis === 'Masuk' ? '+' : '-'} ${formatRupiah(item.nominal)}
              </p>
              <button onclick="hapusSatu(${index})" class="text-[9px] text-slate-600 hover:text-rose-400">Hapus</button>
            </div>
          `;
          daftar.appendChild(li);
        });
      }

      document.getElementById('totalMasuk').innerText = formatRupiah(masuk);
      document.getElementById('totalKeluar').innerText = formatRupiah(keluar);
      document.getElementById('saldoTotal').innerText = formatRupiah(masuk - keluar);

      localStorage.setItem('keuangan_db', JSON.stringify(dataTransaksi));
    }

    function tambahTransaksi() {
      const ket = document.getElementById('keterangan').value.trim();
      const nom = Number(document.getElementById('nominal').value);
      const jns = document.getElementById('jenis').value;

      if (!ket || !nom || nom <= 0) {
        alert('Mohon isi keterangan dan nominal dengan benar!');
        return;
      }

      const tgl = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
      dataTransaksi.unshift({ keterangan: ket, nominal: nom, jenis: jns, tanggal: tgl });

      document.getElementById('keterangan').value = '';
      document.getElementById('nominal').value = '';
      updateUI();
    }

    function hapusSatu(index) {
      dataTransaksi.splice(index, 1);
      updateUI();
    }

    function resetData() {
      if (confirm('Yakin ingin menghapus semua data?')) {
        dataTransaksi = [];
        updateUI();
      }
    }

    updateUI();
  </script>
</body>
</html>
