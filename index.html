<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Keuangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library Chart.js untuk Grafik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { 
      background-color: #e2e8f0; 
      color: #0f172a; 
      font-family: system-ui, -apple-system, sans-serif; 
    }
    .app-card { 
      background-color: #0d4b56; 
      color: #ffffff; 
    }
    /* Style Tombol Senyawa & Flat */
    .btn-seamless {
      background-color: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
      backdrop-filter: blur(4px);
    }
    .btn-seamless:hover {
      background-color: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .btn-emerald { 
      background-color: #059669; 
      color: #ffffff; 
    }
    .btn-emerald:hover { 
      background-color: #047857; 
    }
    .input-custom { 
      background-color: #ffffff; 
      border: 1px solid #cbd5e1; 
      color: #1e293b; 
    }
    .input-custom:focus { 
      outline: none; 
      border-color: #0d4b56; 
    }
    .tab-active { 
      border-bottom: 2px solid #0d4b56; 
      color: #0d4b56; 
      font-weight: 700; 
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4">

  <!-- Container Bingkai HP (Mockup Screen) -->
  <div class="w-full max-w-[360px] bg-white rounded-[32px] shadow-2xl overflow-hidden p-4 space-y-4 border border-slate-200 min-h-[620px] flex flex-col justify-between">
    
    <!-- Kontainer Wajib untuk React di CodeSandbox -->
    <div id="root"></div>

    <!-- ==================== TAMPILAN 1: DASHBOARD UTAMA ==================== -->
    <div id="tampilanUtama" class="space-y-4 flex-1">
      
      <!-- Card Akses Menu Halaman -->
      <div class="app-card p-5 rounded-[24px] shadow-sm space-y-3 relative">
        <div class="flex justify-between items-center text-[10px] font-bold tracking-widest uppercase opacity-75">
          <span>CATATAN ASISTEN</span>
        </div>
        
        <div class="flex justify-between items-center">
          <p class="text-xs font-extrabold uppercase tracking-wider opacity-90">PEMBUKUAN KEUANGAN</p>
        </div>

        <!-- Tombol Senyawa -->
        <div class="grid grid-cols-2 gap-2.5 pt-1">
          <button onclick="bukaHalaman('tampilanUangKeluar')" class="btn-seamless py-2.5 px-2 rounded-2xl text-[10px] font-bold transition-all text-center flex items-center justify-center leading-tight">
            - UANG KELUAR
          </button>
          <button onclick="bukaHalaman('tampilanUangMasuk')" class="btn-seamless py-2.5 px-2 rounded-2xl text-[10px] font-bold transition-all text-center flex items-center justify-center leading-tight">
            + UANG MASUK
          </button>
        </div>
      </div>

      <!-- GRAFIK KEUANGAN -->
      <div class="bg-slate-50 p-4 rounded-[24px] border border-slate-100 shadow-sm space-y-2">
        <div class="flex justify-between items-center">
          <h3 class="text-[11px] font-extrabold text-slate-700 tracking-wider uppercase">RODA PERPUTARAN</h3>
          
          <!-- TOMBOL TRANSAKSI (KLIK LANGSUNG KE KHUSUS DATA TRANSAKSI) -->
          <button onclick="bukaHalaman('tampilanKhususData')" class="text-[10px] font-bold text-teal-700 hover:text-teal-900 transition flex items-center gap-1 bg-teal-50 px-2.5 py-1 rounded-full border border-teal-200 shadow-xs">
            <span id="labelTotalTransaksi">0 Transaksi</span>
            <span>&rsaquo;</span>
          </button>
        </div>
        
        <div class="relative flex items-center justify-center h-48 w-full pt-2">
          <canvas id="grafikKeuangan"></canvas>
        </div>
      </div>

    </div>

    <!-- ==================== TAMPILAN 2: HALAMAN UANG KELUAR ==================== -->
    <div id="tampilanUangKeluar" class="space-y-4 flex-1 hidden">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <button onclick="bukaHalaman('tampilanUtama')" class="text-slate-600 font-bold text-xs flex items-center gap-1 hover:text-slate-900">
          &larr; Kembali
        </button>
        <span class="text-xs font-extrabold text-rose-600 uppercase tracking-wider">Input Uang Keluar</span>
        <div class="w-8"></div>
      </div>

      <div class="bg-rose-900 text-white p-5 rounded-[24px] shadow-md space-y-2 relative">
        <div class="flex justify-between items-center text-[10px] font-bold tracking-widest uppercase opacity-80">
          <span>PENGELUARAN</span>
        </div>
        <div>
          <p class="text-[10px] font-bold uppercase tracking-wider opacity-70">TOTAL UANG KELUAR</p>
          <h2 id="totalKeluar" class="text-2xl font-extrabold tracking-tight pt-1 text-rose-200">Rp 0</h2>
        </div>
      </div>

      <div class="space-y-3 pt-1">
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Jumlah Nominal</label>
          <input type="number" id="nominalKeluar" placeholder="Jumlah (Rp)" class="input-custom w-full p-2.5 rounded-xl text-xs font-medium" />
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Keterangan Transaksi</label>
          <input type="text" id="keteranganKeluar" placeholder="Keterangan (misal: Jajan)" class="input-custom w-full p-2.5 rounded-xl text-xs font-medium" />
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Kategori</label>
          <select id="kategoriKeluar" class="input-custom w-full p-2.5 rounded-xl text-xs font-semibold">
            <option value="BELANJA">Belanja</option>
            <option value="RESTORAN">Restoran</option>
            <option value="TRANSPORT">Transport</option>
            <option value="GAJI">Lain-lain</option>
          </select>
        </div>
        <div class="pt-2">
          <button onclick="tambahTransaksiSpesifik('Keluar')" class="bg-rose-600 hover:bg-rose-700 text-white w-full p-3 rounded-xl text-xs font-bold transition shadow-sm">
            Simpan Uang Keluar
          </button>
        </div>
      </div>
    </div>

    <!-- ==================== TAMPILAN 3: HALAMAN UANG MASUK ==================== -->
    <div id="tampilanUangMasuk" class="space-y-4 flex-1 hidden">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <button onclick="bukaHalaman('tampilanUtama')" class="text-slate-600 font-bold text-xs flex items-center gap-1 hover:text-slate-900">
          &larr; Kembali
        </button>
        <span class="text-xs font-extrabold text-emerald-600 uppercase tracking-wider">Input Uang Masuk</span>
        <div class="w-8"></div>
      </div>

      <div class="bg-emerald-800 text-white p-5 rounded-[24px] shadow-md space-y-2 relative">
        <div class="flex justify-between items-center text-[10px] font-bold tracking-widest uppercase opacity-80">
          <span>PEMASUKAN</span>
        </div>
        <div>
          <p class="text-[10px] font-bold uppercase tracking-wider opacity-70">TOTAL UANG MASUK</p>
          <h2 id="totalMasuk" class="text-2xl font-extrabold tracking-tight pt-1 text-emerald-200">Rp 0</h2>
        </div>
      </div>

      <div class="space-y-3 pt-1">
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Jumlah Nominal</label>
          <input type="number" id="nominalMasuk" placeholder="Jumlah (Rp)" class="input-custom w-full p-2.5 rounded-xl text-xs font-medium" />
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Keterangan Transaksi</label>
          <input type="text" id="keteranganMasuk" placeholder="Keterangan (misal: Gaji)" class="input-custom w-full p-2.5 rounded-xl text-xs font-medium" />
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Kategori</label>
          <select id="kategoriMasuk" class="input-custom w-full p-2.5 rounded-xl text-xs font-semibold">
            <option value="GAJI">Gaji</option>
            <option value="BONUS">Bonus</option>
            <option value="INVESTASI">Hasil Usaha</option>
          </select>
        </div>
        <div class="pt-2">
          <button onclick="tambahTransaksiSpesifik('Masuk')" class="btn-emerald w-full p-3 rounded-xl text-xs font-bold transition shadow-sm">
            Simpan Uang Masuk
          </button>
        </div>
      </div>
    </div>

    <!-- ==================== TAMPILAN KHUSUS: KHUSUS RIWAYAT DATA KELUAR MASUK ==================== -->
    <div id="tampilanKhususData" class="space-y-4 flex-1 hidden">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <button onclick="bukaHalaman('tampilanUtama')" class="text-slate-600 font-bold text-xs flex items-center gap-1 hover:text-slate-900">
          &larr; Kembali
        </button>
        <span class="text-xs font-extrabold text-slate-700 uppercase tracking-wider"> PEMASUKAN & PENGELUARAN </span>
        <div class="w-8"></div>
      </div>

      <!-- Ringkasan Singkat -->
      <div class="grid grid-cols-2 gap-2 text-white">
        <div class="bg-emerald-700 p-3 rounded-2xl shadow-xs">
          <p class="text-[9px] font-bold opacity-80 uppercase">Total Masuk</p>
          <p id="ringkasanMasuk" class="text-xs font-extrabold pt-0.5">Rp 0</p>
        </div>
        <div class="bg-rose-700 p-3 rounded-2xl shadow-xs">
          <p class="text-[9px] font-bold opacity-80 uppercase">Total Keluar</p>
          <p id="ringkasanKeluar" class="text-xs font-extrabold pt-0.5">Rp 0</p>
        </div>
      </div>

      <!-- Filter Tab & Daftar Transaksi -->
      <div class="space-y-3 pt-1">
        <div class="flex space-x-6 text-xs border-b border-slate-100 pb-2">
          <button onclick="setFilter('SEMUA')" id="tab-SEMUA" class="tab-active pb-1 text-[11px]">SEMUA</button>
          <button onclick="setFilter('Keluar')" id="tab-Keluar" class="text-slate-400 font-semibold pb-1 text-[11px]">KELUAR</button>
          <button onclick="setFilter('Masuk')" id="tab-Masuk" class="text-slate-400 font-semibold pb-1 text-[11px]">MASUK</button>
        </div>

        <!-- Tempat Khusus Membaca Seluruh Data -->
        <ul id="daftarTransaksi" class="space-y-2 text-xs max-h-[340px] overflow-y-auto pr-1">
          <li class="py-4 text-center text-slate-400 text-xs">Belum ada data transaksi.</li>
        </ul>
      </div>
    </div>

  </div>

  <script>
    const dataAwal = [
      { keterangan: 'GAJI', nominal: 89000000, jenis: 'Masuk', kategori: 'GAJI', tanggal: '8 SEP' },
      { keterangan: 'UANG SEKOLAH', nominal: 15200000, jenis: 'Masuk', kategori: 'GAJI', tanggal: '8 SEP' },
      { keterangan: 'JAJAN', nominal: 56225145, jenis: 'Keluar', kategori: 'GAJI', tanggal: '8 SEP' },
      { keterangan: 'JAJAN', nominal: 13000000, jenis: 'Keluar', kategori: 'GAJI', tanggal: '8 SEP' },
      { keterangan: 'GAJI', nominal: 22000000, jenis: 'Masuk', kategori: 'GAJI', tanggal: '8 SEP' }
    ];

    let dataTransaksi = JSON.parse(localStorage.getItem('keuangan_db'));
    if (!dataTransaksi || dataTransaksi.length === 0) {
      dataTransaksi = dataAwal;
    }

    let filterAktif = 'SEMUA';
    let chartInstance = null;

    function formatRupiah(angka) {
      const isMinus = angka < 0;
      const absoluteVal = Math.abs(angka);
      const formatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(absoluteVal);
      return isMinus ? '-' + formatted : formatted;
    }

    function bukaHalaman(halamanId) {
      document.getElementById('tampilanUtama').classList.add('hidden');
      document.getElementById('tampilanUangKeluar').classList.add('hidden');
      document.getElementById('tampilanUangMasuk').classList.add('hidden');
      document.getElementById('tampilanKhususData').classList.add('hidden');
      
      document.getElementById(halamanId).classList.remove('hidden');
    }

    function setFilter(filter) {
      filterAktif = filter;
      ['SEMUA', 'Keluar', 'Masuk'].forEach(tab => {
        const el = document.getElementById('tab-' + tab);
        if (tab === filter) {
          el.className = 'tab-active pb-1 text-[11px]';
        } else {
          el.className = 'text-slate-400 font-semibold pb-1 text-[11px]';
        }
      });
      updateUI();
    }

    function renderGrafik() {
      const ctx = document.getElementById('grafikKeuangan').getContext('2d');
      
      let masuk = 0;
      let keluar = 0;

      dataTransaksi.forEach(item => {
        if (item.jenis === 'Masuk') masuk += item.nominal;
        if (item.jenis === 'Keluar') keluar += item.nominal;
      });

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Pemasukan', 'Pengeluaran'],
          datasets: [{
            data: [masuk || 1, keluar || 0],
            backgroundColor: ['#059669', '#e11d48'],
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { boxWidth: 10, font: { size: 10, weight: 'bold' } }
            }
          },
          cutout: '65%'
        }
      });

      document.getElementById('labelTotalTransaksi').innerText = dataTransaksi.length + ' Transaksi';
    }

    function updateUI() {
      const daftar = document.getElementById('daftarTransaksi');
      daftar.innerHTML = '';

      let masuk = 0;
      let keluar = 0;

      dataTransaksi.forEach(item => {
        if (item.jenis === 'Masuk') masuk += item.nominal;
        if (item.jenis === 'Keluar') keluar += item.nominal;
      });

      document.getElementById('totalMasuk').innerText = formatRupiah(masuk);
      document.getElementById('totalKeluar').innerText = formatRupiah(keluar);
      
      // Update Ringkasan Laporan Khusus
      document.getElementById('ringkasanMasuk').innerText = formatRupiah(masuk);
      document.getElementById('ringkasanKeluar').innerText = formatRupiah(keluar);

      const dataFiltered = dataTransaksi.filter(item => {
        if (filterAktif === 'SEMUA') return true;
        return item.jenis === filterAktif;
      });

      if (dataFiltered.length === 0) {
        daftar.innerHTML = '<li class="py-4 text-center text-slate-400 text-xs">Belum ada transaksi.</li>';
      } else {
        dataFiltered.forEach((item, index) => {
          const li = document.createElement('li');
          li.className = 'flex justify-between items-center py-2 px-1 border-b border-dashed border-slate-200 last:border-none';
          
          const isKeluar = item.jenis === 'Keluar';
          const tAnda = isKeluar ? '- ' : '+ ';
          const warnaTeks = isKeluar ? 'text-rose-500' : 'text-emerald-600';

          li.innerHTML = `
            <div>
              <p class="font-extrabold text-slate-800 uppercase text-[11px] leading-tight">${item.keterangan}</p>
              <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">${item.kategori || 'GAJI'} &bull; ${item.tanggal}</p>
            </div>
            <div class="text-right">
              <p class="font-extrabold ${warnaTeks} text-[11px]">
                ${tAnda}${formatRupiah(item.nominal)}
              </p>
              <button onclick="hapusSatu(${index})" class="text-[8px] text-slate-300 hover:text-rose-500">Hapus</button>
            </div>
          `;
          daftar.appendChild(li);
        });
      }

      localStorage.setItem('keuangan_db', JSON.stringify(dataTransaksi));
      renderGrafik();
    }

    function tambahTransaksiSpesifik(jenis) {
      const suffix = jenis === 'Keluar' ? 'Keluar' : 'Masuk';
      const ket = document.getElementById('keterangan' + suffix).value.trim();
      const nom = Number(document.getElementById('nominal' + suffix).value);
      const kat = document.getElementById('kategori' + suffix).value;

      if (!ket || !nom || nom <= 0) {
        alert('Mohon isi keterangan dan nominal dengan benar!');
        return;
      }

      const tgl = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }).toUpperCase();
      dataTransaksi.unshift({ keterangan: ket.toUpperCase(), nominal: nom, jenis: jenis, kategori: kat, tanggal: tgl });

      document.getElementById('keterangan' + suffix).value = '';
      document.getElementById('nominal' + suffix).value = '';
      
      updateUI();
      bukaHalaman('tampilanKhususData');
    }

    function hapusSatu(index) {
      dataTransaksi.splice(index, 1);
      updateUI();
    }

    updateUI();
  </script>
</body>
</html>
