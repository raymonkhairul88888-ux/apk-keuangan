<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Keuangan Modern</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 15% 10%, rgba(20, 184, 166, 0.15), transparent 28%),
        radial-gradient(circle at 85% 90%, rgba(59, 130, 246, 0.14), transparent 30%),
        #07111f;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* =========================
       PHONE FRAME
    ========================= */
    .phone-frame {
      background:
        linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.025)),
        #0b1627;
      border: 1px solid rgba(255,255,255,.10);
      box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        0 0 0 1px rgba(20,184,166,.04),
        inset 0 1px 0 rgba(255,255,255,.06);
    }

    /* =========================
       WATERMARK
    ========================= */
    .watermark-bg {
      position: relative;
      overflow: hidden;
    }

    .watermark-bg::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;

      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500' fill='none' stroke='%2314b8a6' stroke-linecap='round' stroke-linejoin='round'><g stroke-width='14'><path d='M100,100 L400,400 M400,100 L100,400'/><rect x='215' y='40' width='70' height='60' rx='8' fill='%2314b8a6'/><path d='M250,100 L250,150' stroke-width='16'/><path d='M80,80 L110,110 M390,80 L420,110 M80,420 L110,390 M390,420 L420,390' stroke-width='22'/></g><path d='M250,150 C180,150 160,200 160,260 C160,310 190,340 210,360 L210,400 L290,400 L290,360 C310,340 340,310 340,260 C340,200 320,150 250,150 Z' fill='none' stroke='%2314b8a6' stroke-width='14'/><circle cx='210' cy='250' r='25' fill='%2314b8a6'/><circle cx='290' cy='250' r='25' fill='%2314b8a6'/><path d='M250,280 L235,320 L265,320 Z' fill='%2314b8a6'/><path d='M210,370 L210,400 M230,370 L230,400 M250,370 L250,400 M270,370 L270,400 M290,370 L290,400' stroke='%2314b8a6' stroke-width='8'/></svg>");

      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: .035;
      pointer-events: none;
      z-index: 0;
    }

    /* =========================
       MAIN HEADER
    ========================= */
    .app-header {
      position: relative;
      overflow: hidden;

      background:
        linear-gradient(135deg, #123b4a 0%, #0d6b72 48%, #0f766e 100%);

      border: 1px solid rgba(255,255,255,.12);
      box-shadow:
        0 12px 30px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.12);
    }

    .app-header::after {
      content: '';
      position: absolute;
      width: 140px;
      height: 140px;
      right: -50px;
      top: -60px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      filter: blur(3px);
    }

    .app-header::before {
      content: '';
      position: absolute;
      width: 90px;
      height: 90px;
      left: -35px;
      bottom: -45px;
      border-radius: 50%;
      background: rgba(45,212,191,.12);
    }

    /* =========================
       HOME BUTTON
    ========================= */
    .btn-home-modern {
      width: 42px;
      height: 42px;
      border-radius: 15px;

      background:
        linear-gradient(145deg, #38bdf8, #0ea5e9 50%, #0369a1);

      border: 1px solid rgba(255,255,255,.25);

      box-shadow:
        0 8px 18px rgba(2,132,199,.35),
        inset 0 1px 1px rgba(255,255,255,.5);

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      transition: .2s ease;
      position: relative;
      z-index: 2;
    }

    .btn-home-modern:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow:
        0 12px 24px rgba(14,165,233,.38),
        inset 0 1px 1px rgba(255,255,255,.5);
    }

    .btn-home-modern:active {
      transform: scale(.96);
    }

    /* =========================
       DASHBOARD CARD
    ========================= */
    .dashboard-panel {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.025)
        );

      border: 1px solid rgba(255,255,255,.075);

      box-shadow:
        0 15px 35px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.045);

      backdrop-filter: blur(16px);
    }

    /* =========================
       CHART AREA
    ========================= */
    .chart-wrapper {
      background:
        radial-gradient(
          circle at center,
          rgba(20,184,166,.08),
          transparent 65%
        );
    }

    /* =========================
       LEGEND BUTTON
    ========================= */
    .legend-btn {
      transition: .2s ease;
      border: 1px solid transparent;
    }

    .legend-btn:hover {
      transform: translateY(-2px);
    }

    .legend-out {
      background: rgba(244,63,94,.09);
      border-color: rgba(244,63,94,.18);
    }

    .legend-in {
      background: rgba(16,185,129,.09);
      border-color: rgba(16,185,129,.18);
    }

    /* =========================
       BACK BUTTON
    ========================= */
    .btn-back-modern {
      width: 36px;
      height: 36px;
      border-radius: 12px;

      background:
        linear-gradient(145deg, #26364b, #111c2c);

      border: 1px solid rgba(255,255,255,.12);

      box-shadow:
        0 5px 12px rgba(0,0,0,.30),
        inset 0 1px 1px rgba(255,255,255,.10);

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      transition: .2s ease;
      flex-shrink: 0;
    }

    .btn-back-modern:hover {
      background:
        linear-gradient(145deg, #334862, #162438);
      transform: translateX(-2px);
    }

    /* =========================
       PAGE TITLE
    ========================= */
    .page-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    /* =========================
       TOTAL CARD
    ========================= */
    .total-card {
      position: relative;
      overflow: hidden;
      border-radius: 20px;

      box-shadow:
        0 10px 25px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.12);
    }

    .total-out {
      background:
        linear-gradient(145deg, #9f1239, #be123c 45%, #881337);
    }

    .total-in {
      background:
        linear-gradient(145deg, #047857, #059669 45%, #065f46);
    }

    .total-page-out {
      background:
        linear-gradient(145deg, #881337, #be123c 50%, #9f1239);
    }

    .total-page-in {
      background:
        linear-gradient(145deg, #065f46, #059669 50%, #047857);
    }

    /* =========================
       INPUT
    ========================= */
    .input-custom {
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(148,163,184,.18);
      color: #f8fafc;

      box-shadow:
        inset 0 1px 2px rgba(0,0,0,.15);

      transition: .2s ease;
    }

    .input-custom::placeholder {
      color: #64748b;
    }

    .input-custom:focus {
      outline: none;
      border-color: rgba(45,212,191,.65);

      background: rgba(255,255,255,.075);

      box-shadow:
        0 0 0 3px rgba(20,184,166,.10);
    }

    select.input-custom option {
      background: #0f1d2e;
      color: white;
    }

    /* =========================
       SAVE BUTTON
    ========================= */
    .save-btn {
      border: 1px solid rgba(255,255,255,.15);
      box-shadow:
        0 8px 18px rgba(0,0,0,.22),
        inset 0 1px 1px rgba(255,255,255,.18);

      transition: .2s ease;
    }

    .save-btn:hover {
      transform: translateY(-2px);
    }

    .save-out {
      background: linear-gradient(135deg,#e11d48,#be123c);
    }

    .save-in {
      background: linear-gradient(135deg,#10b981,#059669);
    }

    /* =========================
       UNIFIED HEADER
    ========================= */
    .header-unified-pill {
      height: 46px;
      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          rgba(30,41,59,.95),
          rgba(15,23,42,.95)
        );

      padding: 5px 6px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border: 1px solid rgba(255,255,255,.09);

      box-shadow:
        0 8px 20px rgba(0,0,0,.25),
        inset 0 1px 1px rgba(255,255,255,.06);

      width: 100%;
      gap: 8px;
    }

    .header-title-text {
      color: #e2e8f0;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .10em;
      text-transform: uppercase;
      text-align: center;
      flex: 1;
      white-space: nowrap;
    }

    /* =========================
       SETTINGS TOGGLE
    ========================= */
    .toggle-switch-circle {
      width: 34px;
      height: 34px;
      border-radius: 11px;

      background:
        linear-gradient(145deg,#334155,#1e293b);

      border: 1px solid rgba(255,255,255,.10);

      box-shadow:
        0 4px 10px rgba(0,0,0,.30),
        inset 0 1px 1px rgba(255,255,255,.08);

      cursor: pointer;
      transition: .25s ease;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-switch-circle.active {
      background:
        linear-gradient(145deg,#38bdf8,#0284c7);

      box-shadow:
        0 0 16px rgba(14,165,233,.35),
        inset 0 1px 1px rgba(255,255,255,.35);
    }

    /* =========================
       SEGMENTED FILTER
    ========================= */
    .segmented-control {
      background: #0f1b2b;
      padding: 4px;
      border-radius: 14px;

      display: flex;
      gap: 4px;

      border: 1px solid rgba(255,255,255,.06);
    }

    .segmented-btn {
      flex: 1;
      padding: 8px 10px;

      border-radius: 10px;

      font-size: 10px;
      font-weight: 800;

      color: #64748b;

      transition: .2s ease;
      text-align: center;
    }

    .segmented-btn:hover {
      color: #cbd5e1;
    }

    .segmented-btn.active {
      background:
        linear-gradient(135deg,#134e5e,#0f766e);

      color: #ffffff;

      box-shadow:
        0 4px 10px rgba(0,0,0,.25),
        inset 0 1px 1px rgba(255,255,255,.10);
    }

    /* =========================
       TRANSACTION CARD
    ========================= */
    .transaction-card {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.075),
          rgba(255,255,255,.035)
        );

      border: 1px solid rgba(255,255,255,.075);

      border-radius: 16px;

      padding: 12px 13px;

      transition: .2s ease;

      box-shadow:
        0 4px 12px rgba(0,0,0,.12),
        inset 0 1px 0 rgba(255,255,255,.035);

      backdrop-filter: blur(10px);
    }

    .transaction-card:hover {
      transform: translateY(-1px);
      border-color: rgba(45,212,191,.18);
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.095),
          rgba(255,255,255,.045)
        );
    }

    /* =========================
       SCROLLBAR
    ========================= */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }

    /* =========================
       MOBILE
    ========================= */
    @media (max-width: 380px) {
      .phone-frame {
        border-radius: 26px;
        padding: 13px;
      }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-2 sm:p-4">

  <!-- =========================
       PHONE MOCKUP
  ========================= -->
  <div class="phone-frame w-full max-w-[360px] rounded-[32px] overflow-hidden p-4 min-h-[640px] flex flex-col justify-between relative">

    <!-- =========================
         DASHBOARD
    ========================= -->
    <div id="tampilanUtama"
         class="space-y-3 flex-1 flex flex-col watermark-bg">

      <!-- HEADER -->
      <div class="app-header p-4 rounded-[24px] flex items-center justify-between relative shrink-0 z-10">

        <div class="space-y-1 relative z-10">
          <div class="text-[9px] font-bold tracking-[0.18em] uppercase text-cyan-100/70">
            CATATAN ASISTEN
          </div>

          <p class="text-[12px] font-extrabold uppercase tracking-[0.08em] text-white">
            PEMBUKUAN KEUANGAN
          </p>

          <div class="flex items-center gap-1.5 pt-0.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-300 shadow-[0_0_8px_rgba(110,231,183,.8)]"></span>
            <span class="text-[8px] font-semibold text-white/55">
              SISTEM AKTIF
            </span>
          </div>
        </div>

        <button
          onclick="bukaHalamanData('SEMUA')"
          class="btn-home-modern"
          title="Buka Data Transaksi Utama">

          <i data-lucide="layout-dashboard"
             class="w-5 h-5 text-white">
          </i>
        </button>

      </div>


      <!-- DASHBOARD PANEL -->
      <div class="dashboard-panel p-4 rounded-[24px] flex-1 flex flex-col justify-between space-y-3 z-10">

        <div class="space-y-2 flex-1 flex flex-col">

          <div class="flex items-center justify-between">

            <div>
              <h3 class="text-[11px] font-extrabold text-slate-200 tracking-[0.12em] uppercase">
                RODA PERPUTARAN
              </h3>

              <p class="text-[8px] text-slate-500 font-medium pt-1">
                Distribusi seluruh transaksi
              </p>
            </div>

            <div class="w-7 h-7 rounded-lg bg-teal-500/10 border border-teal-400/10 flex items-center justify-center">
              <i data-lucide="pie-chart"
                 class="w-3.5 h-3.5 text-teal-400">
              </i>
            </div>

          </div>


          <!-- CHART -->
          <div class="chart-wrapper relative h-64 w-full flex items-center justify-center my-auto">
            <canvas id="grafikSiklusBulanan"></canvas>
          </div>


          <!-- LEGEND -->
          <div class="flex justify-center items-center gap-2 pt-2">

            <button
              onclick="bukaHalaman('tampilanUangKeluar')"
              class="legend-btn legend-out flex items-center gap-1.5 px-3 py-2 rounded-xl">

              <span class="w-2.5 h-2.5 bg-rose-500 rounded-full shadow-[0_0_8px_rgba(244,63,94,.45)]"></span>

              <span class="text-[10px] font-bold text-rose-300">
                Pengeluaran
              </span>

            </button>


            <button
              onclick="bukaHalaman('tampilanUangMasuk')"
              class="legend-btn legend-in flex items-center gap-1.5 px-3 py-2 rounded-xl">

              <span class="w-2.5 h-2.5 bg-emerald-400 rounded-full shadow-[0_0_8px_rgba(16,185,129,.45)]"></span>

              <span class="text-[10px] font-bold text-emerald-300">
                Pemasukan
              </span>

            </button>

          </div>

        </div>

      </div>

    </div>


    <!-- =========================
         UANG KELUAR
    ========================= -->
    <div id="tampilanUangKeluar"
         class="space-y-4 flex-1 hidden watermark-bg">

      <div class="flex items-center justify-between pb-1 relative z-10">

        <button
          onclick="bukaHalaman('tampilanUtama')"
          class="btn-back-modern">

          <i data-lucide="arrow-left"
             class="w-4 h-4 text-slate-200">
          </i>

        </button>

        <span class="page-title text-rose-400">
          Input Uang Keluar
        </span>

        <div class="w-9"></div>

      </div>


      <!-- TOTAL -->
      <div class="total-card total-page-out text-white p-5 space-y-2 relative overflow-hidden z-10">

        <div class="absolute -right-5 -bottom-6 opacity-10">
          <i data-lucide="arrow-up-right"
             class="w-28 h-28">
          </i>
        </div>

        <div class="relative z-10">

          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-lg bg-white/10 flex items-center justify-center">
              <i data-lucide="trending-down"
                 class="w-3.5 h-3.5">
              </i>
            </span>

            <p class="text-[9px] font-bold uppercase tracking-[0.12em] opacity-65">
              TOTAL UANG KELUAR
            </p>
          </div>

          <h2 id="totalKeluarPage"
              class="text-2xl font-extrabold tracking-tight pt-2 text-rose-100">

          </h2>

        </div>

      </div>


      <!-- FORM -->
      <div class="space-y-3 pt-1 relative z-10">

        <div>
          <label class="text-[9px] font-bold text-slate-500 uppercase tracking-wider block mb-1.5">
            Jumlah Nominal

          <input
            type="number"
            id="nominalKeluar"
            placeholder="Jumlah (Rp)"
            class="input-custom w-full p-3 rounded-xl text-xs font-medium"
          />
        </div>


        <div>
          <label class="text-[9px] font-bold text-slate-500 uppercase tracking-wider block mb-1.5">

          </label>

          <input

            id="keteranganKeluar"
            placeholder="Contoh: Jajan"
            class="input-custom w-full p-3 rounded-xl text-xs font-medium"
          />
        </div>


        <div>
          <label class="text-[9px] font-bold text-slate-500 uppercase tracking-wider block mb-1.5">

          </label>

          <select
            id="kategoriKeluar"
            class="input-custom w-full p-3 rounded-xl text-xs font-semibold">

            <option value="BELANJA">Belanja</option>
            <option value="RESTORAN">Restoran</option>
            <option value="TRANSPORT">Transport</option>
            <option value="LAIN-LAIN">Lain-lain</option>

          </select>
        </div>


        <div class="pt-2">

          <button
            onclick="tambahTransaksiSpesifik('Keluar')"
            class="save-btn save-out text-white w-full p-3.5 rounded-xl text-xs font-bold">

            <span class="flex items-center justify-center gap-2">

              <i data-lucide="plus-circle"
                 class="w-4 h-4">
              </i>

              Simpan Uang Keluar

            </span>

          </button>

        </div>

      </div>

    </div>


    <!-- =========================

    ========================= -->

      <div class="flex items-center justify-between pb-1 relative z-10">

        <button

          <i data-lucide="arrow-left"
             class="w-4 h-4 text-slate-200">
          </i>

        </button>

        <span class="page-title text-emerald-400">
          Input Uang Masuk
        </span>

        <div class="w-9"></div>

      </div>

        <div class="absolute -right-5 -bottom-6 opacity-10">

             class="w-28 h-28">
          </i>
        </div>

        <div class="relative z-10">

            <span class="w-7 h-7 rounded-lg bg-white/10 flex items-center justify-center">
              <i data-lucide="trending-up"
                 class="w-3.5 h-3.5">
              </i>
            </span>

            <p class="text-[9px] font-bold uppercase tracking-[0.12em] opacity-65">
              TOTAL UANG MASUK
            </p>

          </div>

          <h2 id="totalMasukPage"

            Rp 0
          </h2>

        </div>

      </div>


      <!-- FORM -->
      <div class="space-y-3 pt-1 relative z-10">

        <div>
          <label class="text-[9px] font-bold text-slate-500 uppercase tracking-wider block mb-1.5">
            Jumlah Nominal
          </label>

          <input
            type="number"
            id="nominalMasuk"
            placeholder="Jumlah (Rp)"
            class="input-custom w-full p-3 rounded-xl text-xs font-medium"
          />
        </div>


        <div>
          <label class="text-[9px] font-bold text-slate-500 uppercase tracking-wider block mb-1.5">
            Keterangan Transaksi
          </label>

          <input
            type="text"
            id="keteranganMasuk"
            placeholder="Contoh: Gaji"

          />
        </div>


        <div>
          <label class="text-[9px] font-bold text-slate-500 uppercase tracking-wider block mb-1.5">
            Kategori
          </label>

          <select
            id="kategoriMasuk"
            class="input-custom w-full p-3 rounded-xl text-xs font-semibold">

            <option value="GAJI">Gaji</option>
            <option value="BONUS">Bonus</option>
            <option value="INVESTASI">Hasil Usaha / Investasi</option>

          </select>
        </div>


        <div class="pt-2">

          <button
            onclick="tambahTransaksiSpesifik('Masuk')"
            class="save-btn save-in text-white w-full p-3.5 rounded-xl text-xs font-bold">

            <span class="flex items-center justify-center gap-2">

              <i data-lucide="plus-circle"
                 class="w-4 h-4">
              </i>

              Simpan Uang Masuk

            </span>

          </button>

        </div>

      </div>

    </div>


    <!-- =========================
         LAPORAN DATA TRANSAKSI
    ========================= -->
    <div id="tampilanKhususData"
         class="space-y-4 flex-1 flex flex-col hidden watermark-bg">


      <!-- HEADER -->
      <div class="header-unified-pill relative z-10">

        <button
          onclick="bukaHalaman('tampilanUtama')"
          class="btn-back-modern">

          <i data-lucide="arrow-left"
             class="w-3.5 h-3.5 text-slate-200">
          </i>

        </button>


        <span class="header-title-text">

        <div

      <!-- SUMMARY -->
      <div class="grid grid-cols-2 gap-2.5 relative z-10">

          <div class="absolute -right-2 -bottom-3 opacity-10">

          </div>

          <div class="relative z-10">

            <div class="flex items-center gap-1.5">
              <span class="w-5 h-5 rounded-md bg-white/10 flex items-center justify-center">
                <i data-lucide="arrow-up-right"
                   class="w-3 h-3">
                </i>
              </span>

              <p class="text-[8px] font-bold uppercase tracking-wider text-rose-100 opacity-80">
                TOTAL KELUAR
              </p>
            </div>

            <p id="totalKeluarText"
               class="text-[11px] font-black pt-2 tracking-tight">

            </p>

        </div>


        <div class="total-card total-in text-white p-3.5">

          <div class="absolute -right-2 -bottom-3 opacity-10">
            <i data-lucide="arrow-down-left"
               class="w-16 h-16">
            </i>
          </div>

          <div class="relative z-10">

            <div class="flex items-center gap-1.5">

              <span class="w-5 h-5 rounded-md bg-white/10 flex items-center justify-center">

                <i data-lucide="arrow-down-left"
                   class="w-3 h-3">
                </i>

              </span>

              <p class="text-[8px] font-bold uppercase tracking-wider text-emerald-100 opacity-80">
                TOTAL MASUK
              </p>

            </div>

            <p id="totalMasukText"
               class="text-[11px] font-black pt-2 tracking-tight">

      <!-- FILTER -->
      <div class="segmented-control relative z-10">

        <button
          onclick="changeFilter('SEMUA')"

          id="tab-Keluar"

          id="tab-Masuk"

      </div>


      <!-- TRANSACTION LIST -->
      <div class="flex-1 overflow-y-auto custom-scroll pr-1 relative z-10">

             class="space-y-2.5">

  <!-- =========================
       JAVASCRIPT
  ========================= -->
  <script>

    if (typeof ChartDataLabels !== 'undefined') {
      Chart.register(ChartDataLabels);
    }


    const dataAwal = [

      {
        id: 1,
        keterangan: 'LEMBURAN',
        nominal: 5000000,
        jenis: 'Masuk',
        kategori: 'INVESTASI',
        tanggal: '9 SEP'
      },

      {
        id: 2,
        keterangan: 'GAJI',
        nominal: 89000000,
        jenis: 'Masuk',
        kategori: 'GAJI',
        tanggal: '8 SEP'
      },

      {
        id: 3,
        keterangan: 'UANG SEKOLAH',
        nominal: 15200000,
        jenis: 'Masuk',
        kategori: 'GAJI',
        tanggal: '8 SEP'
      },

      {
        id: 4,
        keterangan: 'GAJI',
        nominal: 22000000,
        jenis: 'Masuk',
        kategori: 'GAJI',
        tanggal: '8 SEP'
      },

      {
        id: 5,
        keterangan: 'JAJAN',
        nominal: 56225145,
        jenis: 'Keluar',
        kategori: 'BELANJA',
        tanggal: '8 SEP'
      },

      {
        id: 6,
        keterangan: 'BELANJA BULANAN',
        nominal: 13000000,
        jenis: 'Keluar',
        kategori: 'BELANJA',
        tanggal: '8 SEP'
      }

    ];


    let dataTransaksi =
      JSON.parse(localStorage.getItem('keuangan_db'));

    if (!dataTransaksi || dataTransaksi.length === 0) {
      dataTransaksi = dataAwal;
    }


    let activeFilter = 'SEMUA';
    let chartSiklusInstance = null;
    let isDeleteAllowed = false;


    /* =========================
       FORMAT RUPIAH
    ========================= */

    function formatRupiah(angka) {

      return new Intl.NumberFormat(
        'id-ID',
        {
          style: 'currency',
          currency: 'IDR',
          maximumFractionDigits: 0
        }
      ).format(angka);

    }


    /* =========================
       DELETE MODE
    ========================= */

    function toggleDeleteMode() {

      isDeleteAllowed = !isDeleteAllowed;

      const toggleBtn =
        document.getElementById('toggleDeleteBtn');

      const toggleIcon =
        document.getElementById('toggleDeleteIcon');


      if (isDeleteAllowed) {

        toggleBtn.classList.add('active');

        toggleIcon.classList.remove('text-slate-300');

        toggleIcon.classList.add('text-white');

      } else {

        toggleBtn.classList.remove('active');

        toggleIcon.classList.remove('text-white');

        toggleIcon.classList.add('text-slate-300');

      }

      renderList();

    }


    /* =========================
       PAGE NAVIGATION
    ========================= */

    function bukaHalaman(halamanId) {

      document
        .getElementById('tampilanUtama')
        .classList.add('hidden');

      document
        .getElementById('tampilanUangKeluar')
        .classList.add('hidden');

      document
        .getElementById('tampilanUangMasuk')
        .classList.add('hidden');

      document
        .getElementById('tampilanKhususData')
        .classList.add('hidden');


      document
        .getElementById(halamanId)
        .classList.remove('hidden');

      lucide.createIcons();

    }


    function bukaHalamanData(filterDefault = 'SEMUA') {

      bukaHalaman('tampilanKhususData');

      changeFilter(filterDefault);

    }


    /* =========================
       CHART
    ========================= */

    function renderGrafik() {

      const agregatKategori = {};


      dataTransaksi.forEach(item => {

        const kat =
          item.kategori || 'LAIN-LAIN';


        if (!agregatKategori[kat]) {

          agregatKategori[kat] = {
            total: 0,
            jenis: item.jenis
          };

        }


        agregatKategori[kat].total += item.nominal;

      });


      const labels =
        Object.keys(agregatKategori);


      const dataValues =
        labels.map(
          k => agregatKategori[k].total
        );


      const grandTotal =
        dataValues.reduce(
          (a, b) => a + b,
          0
        ) || 1;


      const bgColors =
        labels.map(k => {

          const jenis =
            agregatKategori[k].jenis;

          if (jenis === 'Keluar') {
            return '#f43f5e';
          }

          return '#10b981';

        });


      const finalLabels =
        labels.length > 0
          ? labels
          : ['Belum Ada Data'];


      const finalData =
        dataValues.length > 0
          ? dataValues
          : [1];


      const finalColors =
        bgColors.length > 0
          ? bgColors
          : ['#334155'];


      const ctxSiklus =
        document
          .getElementById('grafikSiklusBulanan')
          .getContext('2d');


      if (chartSiklusInstance) {
        chartSiklusInstance.destroy();
      }


      chartSiklusInstance =
        new Chart(ctxSiklus, {

          type: 'doughnut',

          data: {

            labels: finalLabels,

            datasets: [{

              data: finalData,

              backgroundColor: finalColors,

              borderWidth: 3,

              borderColor: '#0b1627',

              offset: finalData.map(
                () => 4
              )

            }]

          },


          options: {

            responsive: true,

            maintainAspectRatio: false,

            cutout: '58%',


            plugins: {

              legend: {
                display: false
              },


              tooltip: {

                backgroundColor: '#0f1b2b',

                titleColor: '#f8fafc',

                bodyColor: '#cbd5e1',

                borderColor:
                  'rgba(255,255,255,.08)',

                borderWidth: 1,

                padding: 10,

                callbacks: {

                  label: function(context) {

                    const val =
                      context.raw || 0;

                    const pct =
                      Math.round(
                        (val / grandTotal) * 100
                      );

                    return ` ${context.label}: ${formatRupiah(val)} (${pct}%)`;

                  }

                }

              },


              datalabels: {

                color: '#ffffff',

                font: {
                  weight: 'bold',
                  size: 11
                },

                textShadowBlur: 4,

                textShadowColor:
                  'rgba(0,0,0,.4)',

                formatter: (value) => {

                  if (dataValues.length === 0) {
                    return '0%';
                  }

                  const pct =
                    Math.round(
                      (value / grandTotal) * 100
                    );

                  return pct > 0
                    ? pct + '%'
                    : '';

                }

              }

            }

          }

        });

    }


    /* =========================
       UPDATE UI
    ========================= */

    function updateUI() {

      let masuk = 0;
      let keluar = 0;


      dataTransaksi.forEach(item => {

        if (item.jenis === 'Masuk') {
          masuk += item.nominal;
        }

        if (item.jenis === 'Keluar') {
          keluar += item.nominal;
        }

      });


      document
        .getElementById('totalMasukPage')
        .innerText =
        formatRupiah(masuk);


      document
        .getElementById('totalKeluarPage')
        .innerText =
        formatRupiah(keluar);


      document
        .getElementById('totalMasukText')
        .innerText =
        formatRupiah(masuk);


      document
        .getElementById('totalKeluarText')
        .innerText =
        formatRupiah(keluar);


      localStorage.setItem(
        'keuangan_db',
        JSON.stringify(dataTransaksi)
      );


      renderGrafik();
      renderList();

    }


    /* =========================
       FILTER
    ========================= */

    function changeFilter(filter) {

      activeFilter = filter;


      ['SEMUA', 'Keluar', 'Masuk']
        .forEach(f => {

          const btn =
            document.getElementById(
              'tab-' + f
            );


          if (
            f.toUpperCase() ===
            filter.toUpperCase()
          ) {

            btn.classList.add('active');

          } else {

            btn.classList.remove('active');

          }

        });


      renderList();

    }


    /* =========================
       TRANSACTION LIST
    ========================= */

    function renderList() {

      const container =
        document.getElementById(
          'daftarTransaksi'
        );


      if (!container) return;


      container.innerHTML = '';


      const filteredData =
        dataTransaksi.filter(item => {

          if (activeFilter === 'SEMUA') {
            return true;
          }

          return (
            item.jenis.toUpperCase() ===
            activeFilter.toUpperCase()
          );

        });


      if (filteredData.length === 0) {

        container.innerHTML = `

          <div class="text-center py-12 text-slate-500 space-y-3">

            <div class="w-12 h-12 rounded-2xl bg-slate-800/70 border border-white/5 mx-auto flex items-center justify-center">

              <i
                data-lucide="inbox"
                class="w-6 h-6 stroke-1">
              </i>

            </div>

            <p class="text-[10px] font-semibold">
              Tidak ada transaksi ditemukan
            </p>

          </div>

        `;

      } else {

        filteredData.forEach(item => {

          const isKeluar =
            item.jenis === 'Keluar';


          const bgIcon =
            isKeluar
              ? 'bg-rose-500/10 text-rose-400 border-rose-400/10'
              : 'bg-emerald-500/10 text-emerald-400 border-emerald-400/10';


          const iconName =
            isKeluar
              ? 'arrow-up-right'
              : 'arrow-down-left';


          const textColor =
            isKeluar
              ? 'text-rose-400'
              : 'text-emerald-400';


          const prefix =
            isKeluar
              ? '- '
              : '+ ';


          const deleteButtonHtml =
            isDeleteAllowed
              ? `

                <button
                  onclick="deleteItem(${item.id})"
                  class="w-7 h-7 rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 flex items-center justify-center transition"
                  title="Hapus">

                  <i
                    data-lucide="trash-2"
                    class="w-3.5 h-3.5">
                  </i>

                </button>

              `
              : '';


          const cardHtml = `

            <div class="transaction-card flex items-center justify-between">

              <div class="flex items-center gap-3 min-w-0">

                <div class="w-9 h-9 rounded-xl ${bgIcon} border flex items-center justify-center shrink-0">

                  <i
                    data-lucide="${iconName}"
                    class="w-4 h-4">
                  </i>

                </div>


                <div class="min-w-0">

                  <h4 class="text-[10px] font-extrabold text-slate-200 uppercase tracking-tight truncate">

                    ${item.keterangan}

                  </h4>

                  <p class="text-[8px] font-bold text-slate-500 uppercase tracking-wider pt-1">

                    ${item.kategori}
                    &bull;
                    ${item.tanggal}

                  </p>

                </div>

              </div>


              <div class="text-right flex items-center gap-2 ml-2">

                <div>

                  <p class="text-[10px] font-extrabold ${textColor} whitespace-nowrap">

                    ${prefix}${formatRupiah(item.nominal)}

                  </p>

                </div>

                ${deleteButtonHtml}

              </div>

            </div>

          `;


          container.innerHTML +=
            cardHtml;

        });

      }


      lucide.createIcons();

    }


    /* =========================
       ADD TRANSACTION
    ========================= */

    function tambahTransaksiSpesifik(jenis) {

      const suffix =
        jenis === 'Keluar'
          ? 'Keluar'
          : 'Masuk';


      const ket =
        document
          .getElementById(
            'keterangan' + suffix
          )
          .value
          .trim();


      const nom =
        Number(
          document
            .getElementById(
              'nominal' + suffix
            )
            .value
        );


      const kat =
        document
          .getElementById(
            'kategori' + suffix
          )
          .value;


      if (!ket || !nom || nom <= 0) {

        alert(
          'Mohon isi keterangan dan nominal dengan benar!'
        );

        return;

      }


      const tgl =
        new Date()
          .toLocaleDateString(
            'id-ID',
            {
              day: 'numeric',
              month: 'short'
            }
          )
          .toUpperCase();


      dataTransaksi.unshift({

        id: Date.now(),

        keterangan:
          ket.toUpperCase(),

        nominal:
          nom,

        jenis:
          jenis,

        kategori:
          kat,

        tanggal:
          tgl

      });


      document
        .getElementById(
          'keterangan' + suffix
        )
        .value = '';


      document
        .getElementById(
          'nominal' + suffix
        )
        .value = '';


      updateUI();

      bukaHalamanData('SEMUA');

    }


    /* =========================
       DELETE
    ========================= */

    function deleteItem(id) {

      if (!isDeleteAllowed) return;


      dataTransaksi =
        dataTransaksi.filter(
          item => item.id !== id
        );


      updateUI();

    }


    /* =========================
       INIT
    ========================= */

    updateUI();

    lucide.createIcons();

  </script>

</body>
