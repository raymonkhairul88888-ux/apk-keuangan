<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dompet Digital</title>
    <!-- Chart.js CDN untuk Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 420px; background: #1e293b; min-height: 100vh; position: relative; padding: 20px 16px 90px 16px; border-radius: 16px; }
        
        /* Profile Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 48px; height: 48px; background: #00f2fe; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #0f172a; font-weight: bold; }
        .user-name h3 { font-size: 16px; font-weight: 600; }
        .user-name p { font-size: 12px; color: #94a3b8; }
        .menu-btn { background: #334155; border: none; width: 40px; height: 40px; border-radius: 10px; color: white; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        /* Total Balance Card */
        .balance-section { text-align: center; margin-bottom: 20px; }
        .balance-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        .total-balance { font-size: 32px; font-weight: 700; color: #ffffff; margin-bottom: 16px; }
        
        .stats-grid { display: flex; justify-content: space-around; gap: 10px; }
        .stat-card { flex: 1; background: #334155; padding: 12px; border-radius: 14px; display: flex; align-items: center; gap: 10px; }
        .stat-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; }
        .stat-in { background: rgba(0, 242, 254, 0.15); color: #00f2fe; }
        .stat-out { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .stat-info p { font-size: 10px; color: #94a3b8; }
        .stat-info h4 { font-size: 13px; font-weight: 600; }

        /* Chart Section */
        .chart-card { background: #334155; padding: 16px; border-radius: 18px; margin-bottom: 20px; }
        .chart-container { width: 100%; height: 160px; }

        /* Recent Transactions */
        .section-title { font-size: 14px; font-weight: 600; color: #cbd5e1; margin-bottom: 12px; }
        .tx-list { display: flex; flex-direction: column; gap: 10px; }
        .tx-item { background: #334155; padding: 12px 16px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; }
        .tx-left { display: flex; align-items: center; gap: 12px; }
        .tx-icon { width: 38px; height: 38px; background: #00f2fe; border-radius: 50%; color: #0f172a; display: flex; justify-content: center; align-items: center; font-size: 16px; }
        .tx-title { font-size: 13px; font-weight: 600; }
        .tx-date { font-size: 11px; color: #94a3b8; }
        .tx-amount { font-size: 13px; font-weight: 700; text-align: right; }
        .amount-in { color: #00f2fe; }
        .amount-out { color: #ef4444; }

        /* Navigation Bar Bottom */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: #0f172a; padding: 10px 30px; display: flex; justify-content: space-between; align-items: center; border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .nav-icon { background: none; border: none; color: #64748b; font-size: 22px; cursor: pointer; }
        .nav-icon.active { color: #00f2fe; }
        .add-btn { width: 54px; height: 54px; background: #00f2fe; border: none; border-radius: 50%; color: #0f172a; font-size: 26px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); margin-top: -25px; }

        /* Modal Input */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; width: 90%; max-width: 380px; padding: 20px; border-radius: 16px; border: 1px solid #334155; }
        .modal-content h3 { margin-bottom: 16px; color: #fff; font-size: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #334155; border: 1px solid #475569; border-radius: 8px; color: white; font-size: 13px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
        .btn-cancel { flex: 1; padding: 10px; background: transparent; border: 1px solid #475569; color: #cbd5e1; border-radius: 8px; cursor: pointer; }
        .btn-save { flex: 1; padding: 10px; background: #00f2fe; border: none; color: #0f172a; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header">
        <div class="user-info">
            <div class="avatar">👤</div>
            <div class="user-name">
                <h3>Pengguna</h3>
                <p>Dompet Utama</p>
            </div>
        </div>
        <button class="menu-btn" onclick="resetData()">⚙️</button>
    </div>

    <!-- Balance -->
    <div class="balance-section">
        <p class="balance-label">Total Saldo</p>
        <div class="total-balance" id="totalBalance">Rp 0</div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon stat-in">↑</div>
                <div class="stat-info">
                    <p>Pemasukan</p>
                    <h4 id="statIn" class="amount-in">Rp 0</h4>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon stat-out">↓</div>
                <div class="stat-info">
                    <p>Pengeluaran</p>
                    <h4 id="statOut" class="amount-out">Rp 0</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- Chart -->
    <div class="chart-card">
        <div class="chart-container">
            <canvas id="financeChart"></canvas>
        </div>
    </div>

    <!-- Transactions List -->
    <div class="section-title">Riwayat Transaksi</div>
    <div class="tx-list" id="txList"></div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-icon active">🏠</button>
        <button class="add-btn" onclick="openModal()">+</button>
        <button class="nav-icon" onclick="resetData()">🗑️</button>
    </div>
</div>

<!-- Modal Form -->
<div class="modal" id="inputModal">
    <div class="modal-content">
        <h3>Tambah Transaksi Baru</h3>
        <form id="txForm">
            <div class="form-group">
                <label>Keterangan</label>
                <input type="text" id="keterangan" placeholder="Contoh: Belanja / Gaji" required>
            </div>
            <div class="form-group">
                <label>Nominal (Rp)</label>
                <input type="number" id="jumlah" placeholder="0" required>
            </div>
            <div class="form-group">
                <label>Jenis Transaksi</label>
                <select id="jenis">
                    <option value="pemasukan">Pemasukan (+)</option>
                    <option value="pengeluaran">Pengeluaran (-)</option>
                </select>
            </div>
            <div class="modal-btns">
                <button type="button" class="btn-cancel" onclick="closeModal()">Batal</button>
                <button type="submit" class="btn-save">Simpan</button>
            </div>
        </form>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('dompet_dark_db')) || [];
    let myChart = null;

    function formatRupiah(angka) {
        return 'Rp ' + Number(angka).toLocaleString('id-ID');
    }

    function openModal() { document.getElementById('inputModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('inputModal').style.display = 'none'; }

    document.getElementById('txForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const keterangan = document.getElementById('keterangan').value.trim();
        const jumlah = parseInt(document.getElementById('jumlah').value, 10);
        const jenis = document.getElementById('jenis').value;
        const now = new Date();
        const tanggal = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) + ' ' + now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        if(!keterangan || isNaN(jumlah) || jumlah <= 0) return;

        db.push({ id: Date.now(), keterangan, jumlah, jenis, tanggal });
        localStorage.setItem('dompet_dark_db', JSON.stringify(db));

        closeModal();
        this.reset();
        renderApp();
    });

    function renderApp() {
        const txList = document.getElementById('txList');
        txList.innerHTML = '';

        let totalIn = 0;
        let totalOut = 0;

        db.forEach(tx => {
            if(tx.jenis === 'pemasukan') totalIn += tx.jumlah;
            else totalOut += tx.jumlah;

            const isInc = tx.jenis === 'pemasukan';
            const itemHtml = `
                <div class="tx-item">
                    <div class="tx-left">
                        <div class="tx-icon">${isInc ? '🛒' : '💸'}</div>
                        <div>
                            <div class="tx-title">${tx.keterangan}</div>
                            <div class="tx-date">${tx.tanggal}</div>
                        </div>
                    </div>
                    <div class="tx-amount ${isInc ? 'amount-in' : 'amount-out'}">
                        ${isInc ? '+' : '-'}${formatRupiah(tx.jumlah)}
                    </div>
                </div>
            `;
            txList.insertAdjacentHTML('afterbegin', itemHtml);
        });

        document.getElementById('totalBalance').innerText = formatRupiah(totalIn - totalOut);
        document.getElementById('statIn').innerText = formatRupiah(totalIn);
        document.getElementById('statOut').innerText = formatRupiah(totalOut);

        updateChart(totalIn, totalOut);
    }

    function updateChart(totalIn, totalOut) {
        const ctx = document.getElementById('financeChart').getContext('2d');
        
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Pemasukan', 'Pengeluaran'],
                datasets: [{
                    label: 'Nominal',
                    data: [totalIn, totalOut],
                    borderColor: '#00f2fe',
                    backgroundColor: 'rgba(0, 242, 254, 0.2)',
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#00f2fe',
                    pointRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                }
            }
        });
    }

    function resetData() {
        if(confirm('Hapus semua data transaksi?')) {
            localStorage.removeItem('dompet_dark_db');
            db = [];
            renderApp();
        }
    }

    renderApp();
</script>

</body>
</html>
